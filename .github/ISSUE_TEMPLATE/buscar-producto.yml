name: "🔍 Buscar producto en varias tiendas"
description: Escribe lo que quieres (p. ej. "leather jacket" o "iPad Pro") y lo comparo cada día en Amazon, Walmart, Target, H&M, Forever 21 y más
title: "Buscar: "
labels: ["nueva-busqueda"]
body:
  - type: input
    id: query
    attributes:
      label: Qué quieres
      description: Escríbelo como lo buscarías en una tienda. En inglés suele dar más resultados en tiendas de EE. UU.
      placeholder: "women's leather jacket"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Nombre para mostrar
      description: Opcional, p. ej. "Chamarra de piel".
  - type: dropdown
    id: category
    attributes:
      label: Categoría
      options: [Ropa, Zapatos, Electrónica, Gadgets, Hogar, Belleza, Accesorios, Deportes, Libros, Otros]
    validations:
      required: true
  - type: input
    id: min
    attributes:
      label: Precio mínimo
      description: Opcional. Ayuda a ignorar accesorios baratos (fundas, cables…).
  - type: input
    id: max
    attributes:
      label: Precio máximo
      description: Opcional.
  - type: input
    id: target
    attributes:
      label: Precio objetivo
      description: Opcional. Te aviso por Telegram cuando alguna tienda lo tenga a este precio o menos.
  - type: input
    id: must
    attributes:
      label: Debe incluir
      description: Opcional. Palabras que deben aparecer en el título, separadas por espacios (p. ej. "ipad pro 13").
  - type: input
    id: exclude
    attributes:
      label: Excluir palabras
      description: Opcional, separadas por comas (p. ej. "case, cover, funda, refurbished").
  - type: checkboxes
    id: fav
    attributes:
      label: Tiendas
      options:
        - label: Solo mis tiendas favoritas (Amazon, Walmart, Target, H&M, Forever 21… se configuran en config.json)
  - type: textarea
    id: notes
    attributes:
      label: Notas
