name: Agregar artículo

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  add:
    # solo issues del formulario y creados por la dueña del repo
    if: contains(github.event.issue.labels.*.name, 'nuevo-articulo') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agregar a la wishlist
        id: add
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/add_item.py
      - name: Guardar cambios
        if: steps.add.outputs.ok == 'true'
        run: |
          git config user.name "wishlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "Agregar ${{ steps.add.outputs.id }}" && git pull --rebase && git push)
      - name: Responder y cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.add.outputs.summary || 'Algo falló, revisa el log del workflow.' }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$SUMMARY"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
