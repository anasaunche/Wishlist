name: Agregar artículo

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  add:
    # solo issues de los formularios y creados por la dueña del repo
    if: (contains(github.event.issue.labels.*.name, 'nuevo-articulo') || contains(github.event.issue.labels.*.name, 'nueva-busqueda')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agregar a la wishlist
        id: add
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          IS_SEARCH: ${{ contains(github.event.issue.labels.*.name, 'nueva-busqueda') }}
        run: |
          if [ "$IS_SEARCH" = "true" ]; then python scripts/add_search.py; else python scripts/add_item.py; fi
      - name: Guardar cambios
        if: steps.add.outputs.ok == 'true'
        run: |
          git config user.name "wishlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "Agregar ${{ steps.add.outputs.id }}" && git pull --rebase && git push)
      - name: Responder y cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.add.outputs.summary || 'Algo falló, revisa el log del workflow.' }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$SUMMARY"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
